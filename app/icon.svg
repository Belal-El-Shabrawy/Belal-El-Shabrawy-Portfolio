<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Palette and treatment come straight from the site: the #00c6ff to #0072ff
       ramp is the one `.blue-gradient_text` uses, and the heavy black outline
       echoes the neo-brutalist cards. It also keeps the mark readable on both a
       light and a dark browser tab strip, which a bare gradient would not.

       The B is a path, not <text>: SVG text renders in whatever font the
       browser happens to pick, which is not something a favicon can afford. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="1" stop-color="#0072ff"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)" stroke="#000" stroke-width="4"/>

  <!-- Two bowls sharing a stem, counters knocked out by the even-odd rule.
       The B spans 18..46 on both axes, so it is centred with equal margins, and
       every wall - top, bottom, right, and the middle bar - is 6 units thick.
       Deliberately chunky: thinner strokes close up into mush at 16px. -->
  <path fill="#fff" fill-rule="evenodd"
        d="M18 12 H34.5 A9.5 9.5 0 0 1 34.5 31 H18 Z
           M18 31 H35.5 A10.5 10.5 0 0 1 35.5 52 H18 Z
           M26 18 H33 A5 5 0 0 1 33 28 H26 Z
           M26 34 H34 A6 6 0 0 1 34 46 H26 Z"/>
</svg>

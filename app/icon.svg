<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Arabic ب (Ba, for Belal): a navy letter on a white tile with a navy
       border, so it stays visible on both light and dark tab strips. The
       strokes are 9 units thick so the letter still reads at 16px. -->
  <rect x="1.75" y="1.75" width="60.5" height="60.5" rx="12.5" fill="#ffffff" stroke="#0b1120" stroke-width="3.5"/>
  <path d="M53 14 V26 Q53 36 43 36 H21 Q11 36 11 26 V22" fill="none" stroke="#0b1120" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="50" r="6" fill="#0072ff"/>
</svg>
